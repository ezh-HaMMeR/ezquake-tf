name: Fallback release package build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Build client
        uses: lukka/run-cmake@v10
        with:
          configurePreset: msbuild-x64
          buildPreset: msbuild-x64-release

      - name: Package client and custom assets
        shell: pwsh
        run: |
          $package = "ezquake-tf-windows-x64"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "build-msbuild-x64/Release/ezquake.exe" $package
          Copy-Item "hud_teammates_variables.txt" $package
          Copy-Item "qw" $package -Recurse
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "$package.zip.sha256" -NoNewline

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ezquake-tf-windows-x64.zip
            ezquake-tf-windows-x64.zip.sha256
          if-no-files-found: error
